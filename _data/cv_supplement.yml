research_statement_ko: >-
  주 연구분야는 1) 재활로봇 및 웨어러블로봇 연구개발, 그리고 2) 근전도/뇌전도 등 생체신호 연계 로봇제어방법 연구개발,
  3) 디지털헬스케어를 위한 인체데이터 모니터링 및 동작분류 연구입니다.
