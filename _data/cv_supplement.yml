technology:
- date: '2021'
  title:
    en: Rebless Planar
    ko: Rebless Planar
  original_details_ko:
  - (기기 설명) 엔드이펙터 방식의 상지재활로봇 (의료기기 3등급, 제허 21-1020호)
  - (참여 분야) 엔드이펙터 방식 상지재활로봇 및 구성요소 기획 및 개발 발주
  - (성과 활용) 서울아산병원(2022) 등 3개 기관 임상현장 활용
  details:
    en: Planned the end-effector upper-limb rehabilitation robot and its components and commissioned their development. Korean Class III medical
      device, approval 21-1020. Clinical sites included Asan Medical Center in 2022.
    ko: 엔드이펙터 방식 상지재활로봇과 구성요소를 기획하고 개발 발주를 담당했다. 의료기기 3등급, 제허 21-1020호. 2022년 서울아산병원 등에서 임상에 활용됐다.
- date: '2014'
  title:
    en: Morning Walk
    ko: Morning Walk
  original_details_ko:
  - (기기 설명) 체중지지 안장을 적용한 엔드이펙터 방식의 보행재활로봇 (의료기기 3등급, 제허 14-3262호)
  - (참여 분야) 평지보행 및 계단보행 훈련, 체중탈부하 훈련 기능과 사용자 인터페이스 등 보행재활로봇 제어프로그램 전체를 개발
  - (성과 활용) 세브란스재활병원(2019), 인제대학교 일산백병원(2019), 전북대학교병원(2020), 국민건강보험일산병원(2015), 국립재활원(2015) 등
  details:
    en: Developed the control software and user interface for an end-effector gait trainer with saddle body-weight support, including level walking,
      stair walking and unloading. Korean Class III medical device, approval 14-3262.
    ko: 체중지지 안장을 적용한 엔드이펙터 보행재활로봇의 제어 소프트웨어와 사용자 인터페이스를 개발했다. 평지·계단 보행과 체중탈부하 훈련 기능을 구현했다. 의료기기 3등급, 제허 14-3262호.
- date: '2014'
  title:
    en: Carrybot
    ko: Carrybot
  original_details_ko:
  - (기기 설명) 안정적 체중지지를 위해 업힘 방식을 적용한 이승 돌봄로봇 (전동식환자리프트, 의료기기 1등급, 경인 제신 14-679호)
  - (참여 분야) 이승 및 이동기능 구현 등 이승돌봄로봇의 제어프로그램 전체를 개발
  details:
    en: Developed the control software for a powered patient lift, including transfer and mobility functions. Korean Class I medical device, notification
      14-679.
    ko: 업힘 방식의 전동식 환자 리프트에서 이승·이동 기능 등 제어 소프트웨어 전반을 개발했다. 의료기기 1등급, 경인 제신 14-679호.
